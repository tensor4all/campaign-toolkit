# The stack: which revision of each measured library the benchmark campaigns measure.
#
# This is the one place a version is decided. Each benchmark repository pins this toolkit
# by revision, so the toolkit's revision also fixes the stack; the repositories' own pin
# files are generated from here (`campaign-sync-pins`) and checked against it in CI
# (`campaign-sync-pins --check`). `campaign-stack-status` lists, for the daily patrol, every
# repository's pin, newest run and CI state. Validated against schemas/stack-pins.schema.json.
#
# A library's revision is the target of the next campaign; a repository's pin is what its pages
# were measured at, and `campaign-check-pin-recorded` (run by `gen_index --check`) fails a pin no
# publication was measured at. Until a repository records the target, its `consumes` entry holds
# the pin at the last measured revision with `measured:` and a `note`; the hold is printed by
# `campaign-sync-pins` and `campaign-stack-status`, and is dropped in the change that records the
# target and moves the pin.
#
# `colmat-benchmark` was `faer-benchmark` until the GitHub rename of 2026-11-13; run directories
# recorded before it carry the old local path, which is history and is not rewritten.
#
# `campaign_toolkit/stack/stack-pins.yaml` is the packaged copy that an installed toolkit
# reads; a test fails if the two differ. Edit this one and copy it over.
#
# State: published t4a-faer 0.28.0, the other releases of 2026-10-30, tenferro-rs main
# (untagged, after v0.8.1), tensor4all-rs main, whose own git dependency stays on
# tenferro v0.8.0, and tcontract-rs main (untagged, at the qcbench harness merge, which is
# in no release). Every declared tag and crates.io source commit is checked with
# `python -m campaign_toolkit.stack --remote`; t4a-faer 0.28.0, tenferro-rs main and
# tcontract-rs main have no remote tag.
schema_version: 1

libraries:
  t4a-faer:
    repo: https://github.com/tensor4all/faer
    crate: t4a-faer
    version: "0.28.0"
    tag: null
    commit: 325e482b6532624d06236ad6991a41c57b0c23d1
    note: "published crates.io source for t4a-faer 0.28.0 (faer#182); the faer campaign separately discloses its predecessor measurement and threadteam 0.2.0/0.3.0 limitation"
  faer-upstream:
    repo: https://codeberg.org/sarah-quinones/faer
    crate: faer
    version: "0.24.4"
    tag: faer-v0.24.4
    commit: 0539947ffb757a739d7e703a7d2fa0c792a909c1
    note: the newest upstream release, an ancestor of t4a-faer 0.27.1 (the fork also merged upstream main up to the untagged 0ecd846, 2026-10-17); the reference arm, the pin file names the tag
  tlinalg:
    repo: https://github.com/tensor4all/tlinalg-rs
    crate: tlinalg
    version: "0.8.0"
    tag: v0.8.0
    commit: 53d1f0d9f44378596c4f2bce932e45cc961b0d78
  tcontract:
    repo: https://github.com/tensor4all/tcontract-rs
    crate: tcontract
    version: null
    tag: null
    commit: a045446301442ebb7540c806d9914dccce62357a
    note: "tcontract-rs main at the qcbench vendor-pool fix (tensor4all/tcontract-rs#191, merge a045446): neither the qcbench harness (#187) nor the fix is in a release yet - v0.12.0 (abf8c72) predates both - so the campaign measures this main head until one contains them"
  tcontract-v1:
    repo: https://github.com/tensor4all/tcontract-rs
    crate: tcontract
    version: null
    tag: null
    commit: 0df08df4651413c629903b378eae2c3685716bbd
    note: "the frozen timing-v1 campaign's measured revision: its newest pages (tcbench and per-shape, 2026-10-10) were measured at 0df08df (then tprims-rs, #101). The pin had been moved to the rename merge 8abfa38 (#108, ten commits later) on 2026-10-11 without a recording; the v1 campaign is frozen, so it stays here"
  cpueinsum:
    repo: https://github.com/tensor4all/cpueinsum-rs
    crate: cpueinsum
    version: "0.9.0"
    tag: v0.9.0
    commit: 124aa12d7c70ae4e5d0f499c549999469118f6de
  einsum-corpus:
    repo: https://github.com/tensor4all/tenferro-einsum-benchmark
    crate: null
    version: null
    tag: null
    commit: 753c0b3e8d9748115f3e921956283e64d8e0cf0f
    note: the einsum instance corpus (14 instances) the cpueinsum campaign reads; main, there is no release
  tenferro:
    repo: https://github.com/tensor4all/tenferro-rs
    crate: tenferro-runtime
    version: null
    tag: null
    commit: 9a850b06155405acc99ecd0648829e9e6d3866ba
    note: "tenferro-rs main after tenferro-rs#2439 (traced values are owned by a TraceContext; the context-free TracedTensor constructors are gone) and #2490 (an external payload's view request answers None); tenferro-benchmark#364 builds against it, so the weekly GPU build is green again; tenferro-runtime is the crate tensor4all-rs imports as `tenferro`"
  tensor4all-rs:
    repo: https://github.com/tensor4all/tensor4all-rs
    crate: tensor4all-core
    version: null
    tag: null
    commit: 12f14b9b3920fdec6f4fd1b5dde513f76586b0ec
    note: git dependency of the tensor4all benchmark; main at tensor4all-rs#1036, the first commit on tenferro v0.8.0 (and hataori c0990c40, which pins the same tenferro)

# The nine benchmark repositories the patrol covers. `consumes` says where each one carries
# a pin: a `rev-file` is a `pins/<name>.rev` file (`#` comments allowed, the last other line
# is the value: the library's `commit`, or its `tag` when `field` says so), `workflow-env` is
# an `env` assignment `KEY: value` in a workflow file, `cargo-git-rev` is the `rev = "..."` of
# every Cargo dependency on the library's repository. Only `rev-file` entries are written by
# the sync tool; the others are checked and must be edited by hand. `run_dirs` are globs, below
# the repository root, of the run directories whose names carry a timestamp.
repositories:
  - name: colmat-benchmark
    consumes:
      - kind: rev-file
        file: pins/t4a-faer.rev
        library: t4a-faer
        field: commit
        # The 2026-11-13 publication records both suites and both vendors at 325e482;
        # the pin now follows that measured release revision.
      - {kind: rev-file, file: pins/upstream-faer.rev, library: faer-upstream, field: tag}
    run_dirs: [data/results/*/*/*]
  - name: tlinalg-benchmark
    consumes:
      - {kind: rev-file, file: pins/tlinalg-rs.rev, library: tlinalg, field: commit}
    run_dirs: [data/results/*/*/*]
  - name: tcontract-benchmark
    consumes:
      - kind: rev-file
        file: pins/tcontract-rs-v2.rev
        library: tcontract
        field: commit
        measured: 9f793ede6b8076fd7ce2251594a9552ad66aa339
        note: "the timing-v2 pages (tcbench and per-shape, zen5-cpu, 2026-10-31) were measured at v0.9.0 (9f793ed); the qcbench target a045446 has no publication yet. The pin moves with the publication that measures it"
      - {kind: rev-file, file: pins/tcontract-rs.rev, library: tcontract-v1, field: commit}
    run_dirs: [data/results/*/*/*, data/v2-results/*/*/*/*]
  - name: cpueinsum-benchmark
    consumes:
      - {kind: rev-file, file: pins/cpueinsum-rs.rev, library: cpueinsum, field: commit}
      - {kind: rev-file, file: pins/tenferro-einsum-benchmark.rev, library: einsum-corpus, field: commit}
    run_dirs: [data/v2-results/*/*/*/*]
  - name: tenferro-benchmark
    consumes:
      - {kind: rev-file, file: pins/tenferro-rs.rev, library: tenferro, field: commit}
    run_dirs: [data/results/*/*/*/*]
  - name: tensor4all-benchmark
    consumes:
      - {kind: cargo-git-rev, file: Cargo.toml, library: tensor4all-rs, field: commit}
    run_dirs: []
  - name: strided-rs-benchmark-suite
    consumes: []
    run_dirs: []
    note: out of scope for the stack re-measurement; patrolled for CI and activity only
  - name: tenferro-einsum-benchmark
    consumes: []
    run_dirs: []
    note: the einsum corpus; frozen (archive planned), read by the cpueinsum campaign at the commit above
  - name: campaign-toolkit
    consumes: []
    run_dirs: []
    note: holds this file; a campaign's toolkit revision is the stack revision it measures under
