# A hardware profile: a machine (or a well-defined container on one) whose cells
# are only comparable with each other. A profile is a fact about a machine, not
# about a campaign, so the library lives here and a campaign's
# `benchmarks/profiles.yaml` names the ones it measures. Adding a profile is a
# deliberate act: an unknown profile in a run manifest is a schema error, not a
# warning.
# The development host: its pages are provisional and are superseded by the measurement host's
# dataset once that machine exists.
role: development
name: zen5-cpu
description: >-
  AMD Ryzen AI 9 HX 470 (Zen5 mobile APU), 12 physical / 24 logical cores.
  Heterogeneous L3: CPUs 0-3 share 16 MiB, CPUs 4-11 share 8 MiB, so a
  thread set must be stated together with the domain it sits in. SMT
  siblings of CPUs 4-11 are 16-23; the idle gate checks them too, because a
  busy sibling contends with the physical core being measured.
cpu: AMD Ryzen AI 9 HX 470
logical_cpus: 24
l3: "0-3: 16 MiB shared; 4-11: 8 MiB shared"
# SMT siblings of CPU n are n+12 (`lscpu -e`); the idle gate and the thread rows below derive from this.
smt: {threads_per_core: 2, sibling_offset: 12}
# One logical CPU per physical core is measured, so SMT never inflates a row, and the observer
# (whatever else runs, e.g. the agent that drives the run) stays on the other L3 domain, never on
# an SMT sibling of a measured core.
thread_rows:
  - {threads: 1, measured: "0", observer: "4-11,16-23"}
  - {threads: 4, measured: "0-3", observer: "4-11,16-23"}
  - {threads: 8, measured: "4-11", observer: "0-3,12-15"}
