# A hardware profile: a machine (or a well-defined container on one) whose cells
# are only comparable with each other. A profile is a fact about a machine, not
# about a campaign, so the library lives here and a campaign's
# `benchmarks/profiles.yaml` names the ones it measures. Adding a profile is a
# deliberate act: an unknown profile in a run manifest is a schema error, not a
# warning.
# The measurement host from the evo -> evo2 switch (colmat-benchmark#129). evo was a
# 4 Zen5 + 8 Zen5c hybrid, so a thread set above 4 mixed core types; this machine is
# 16 uniform full Zen5 cores, which is what the core-count scaling story needs.
role: measurement
name: evo2-zen5-16c
description: >-
  AMD Ryzen AI MAX+ 395 (Strix Halo), 16 physical / 32 logical cores, SMT on.
  L3 is 64 MiB in two 32 MiB instances: cpus 0-7 and their siblings 16-23 share
  one, cpus 8-15 and their siblings 24-31 share the other, so a thread set must
  be stated together with the domain it sits in. 1 socket, 1 NUMA node (0-31).
  The cores are uniform: `amd_pstate_highest_perf` is 166 on every core, where
  evo (zen5-cpu) read 196 on cpus 0-3 and 124 on its Zen5c compact cores 4-11.
  This profile replaces zen5-cpu for new measurements; zen5-cpu stays as the
  historical machine, because its published rows were measured entirely on the
  compact cores (colmat-benchmark#130).
cpu: AMD Ryzen AI MAX+ 395
logical_cpus: 32
l3: "0-7,16-23: 32 MiB shared; 8-15,24-31: 32 MiB shared"
# SMT siblings of CPU n are n+16 (`lscpu -e`, `thread_siblings_list` for cpu 0 is
# `0,16`); the idle gate and the thread rows below derive from this.
smt: {threads_per_core: 2, sibling_offset: 16}
# One logical CPU per physical core is measured, so SMT never inflates a row. The 1T, 4T
# and 8T rows stay inside the 0-7,16-23 L3 domain. The observer (whatever else runs, e.g.
# the agent that drives the run) is every CPU that is neither measured nor an SMT sibling
# of a measured core; at 8T that is exactly the other domain.
#
# 16T is one thread per physical core, cpus 0-15, which is how the ohtaka nodes are used,
# so it spans both L3 domains. Their siblings are all 16 remaining CPUs, so no CPU is left
# for an observer: the empty observer is deliberate, as zen2-cpu's 64T row. The recorder
# treats such a row as unobserved (a recorded caveat, not a refusal) only when the measured
# CPUs cover every online CPU, i.e. with SMT off (siblings 16-31 offline). With SMT on, it
# refuses to record the 16T row, because the recorder and the driving agent would have to
# share the measured cores' siblings. Declaring the row here does not settle that; the run
# that records it must take SMT off first, and its cells are compared with the 1/4/8T rows
# only after that choice is stated on the page.
thread_rows:
  - {threads: 1, measured: "0", observer: "1-15,17-31"}
  - {threads: 4, measured: "0-3", observer: "4-15,20-31"}
  - {threads: 8, measured: "0-7", observer: "8-15,24-31"}
  - {threads: 16, measured: "0-15", observer: ""}
