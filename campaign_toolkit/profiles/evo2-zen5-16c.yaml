# A hardware profile: a machine (or a well-defined container on one) whose cells
# are only comparable with each other. A profile is a fact about a machine, not
# about a campaign, so the library lives here and a campaign's
# `benchmarks/profiles.yaml` names the ones it measures. Adding a profile is a
# deliberate act: an unknown profile in a run manifest is a schema error, not a
# warning.
# The measurement host from the evo -> evo2 switch (colmat-benchmark#129). evo was a
# 4 Zen5 + 8 Zen5c hybrid, so a thread set above 4 mixed core types; this machine is
# 16 uniform full Zen5 cores, which is what the core-count scaling story needs.
role: measurement
name: evo2-zen5-16c
description: >-
  AMD Ryzen AI MAX+ 395 (Strix Halo), 16 physical / 32 logical cores, SMT on.
  L3 is 64 MiB in two 32 MiB instances: cpus 0-7 and their siblings 16-23 share
  one, cpus 8-15 and their siblings 24-31 share the other, so a thread set must
  be stated together with the domain it sits in.
cpu: AMD Ryzen AI MAX+ 395
logical_cpus: 32
l3: "0-7,16-23: 32 MiB shared; 8-15,24-31: 32 MiB shared"
# SMT siblings of CPU n are n+16 (`lscpu -e`, `thread_siblings_list` for cpu 0 is
# `0,16`); the idle gate and the thread rows below derive from this.
smt: {threads_per_core: 2, sibling_offset: 16}
# One logical CPU per physical core is measured, so SMT never inflates a row, and the
# observer (whatever else runs, e.g. the agent that drives the run) stays on the other
# L3 domain, never on an SMT sibling of a measured core.
#
# 16 is deliberately absent. 16T means one thread per physical core here, which is
# exactly cpus 0-15, whose SMT siblings are all 16 remaining cpus: every cpus that is
# not measured is a sibling of a measured core, so no observer CPU is left and the
# recorder refuses the row rather than contending with a measured core. 16T needs its
# monitoring condition decided first (SMT off and all 16 cores measured, or an 8-core
# SMT-on row that is not comparable with these three).
thread_rows:
  - {threads: 1, measured: "0", observer: "1-15,17-31"}
  - {threads: 4, measured: "0-3", observer: "4-15,20-31"}
  - {threads: 8, measured: "0-7", observer: "8-15,24-31"}
