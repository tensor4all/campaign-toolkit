[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-toolkit"
version = "0.1.0"
description = "Shared tooling for the tensor4all benchmark campaigns, parameterised by a per-campaign descriptor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hiroshi Shinaoka", email = "h.shinaoka@gmail.com" }]
dependencies = ["pyyaml>=6", "markdown>=3.4"]

[project.scripts]
campaign-record-run = "campaign_toolkit.record_run:main"
campaign-validate-run = "campaign_toolkit.validate_run:main"
campaign-gen-index = "campaign_toolkit.gen_index:main"
campaign-publish-report = "campaign_toolkit.publish_report:main"
campaign-compare-runs = "campaign_toolkit.compare_runs:main"
campaign-report-run = "campaign_toolkit.report_run:main"
campaign-descriptor = "campaign_toolkit.campaign:main"
campaign-validate-declarations = "campaign_toolkit.declarations:main"
campaign-union-index = "campaign_toolkit.union_index:main"
campaign-sync-pins = "campaign_toolkit.sync_pins:main"
campaign-stack-status = "campaign_toolkit.stack_status:main"
campaign-trend = "campaign_toolkit.trend:main"
campaign-check-generated = "campaign_toolkit.check_generated:main"

[tool.setuptools]
packages = ["campaign_toolkit"]

[tool.setuptools.package-data]
campaign_toolkit = ["schemas/*.json", "profiles/*.yaml", "stack/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# The ported campaign scripts keep their own hand-ordered imports and a few
# deliberate shapes (`subprocess.run` without `check` where the return code is
# inspected, a lock file kept open for its `flock`). Check for real errors only:
# pycodestyle errors, and pyflakes. E501 is left to the repository's own style.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
