schema_version: 1
id: fixture-campaign

measured:
  name: fixture-rs
  url: https://example.invalid/fixture-rs
  pin_file: pins/fixture-rs.rev
  extern_dir: extern/fixture-rs
  build_script: scripts/build_fixture_rev.sh
  binary: fixturebench
  harness_args: ["--corpus", "fixture-instances"]
  features:
    openblas: fixture-bench/link-openblas
  provider_packages:
    - fixdeps
  pin_env:
    rev: FIXTURE_REV
    dirty: FIXTURE_DIRTY
    dir: FIXTURE_DIR
    features: BUILD_FEATURES

identities: [library]

profiles_file: benchmarks/profiles.yaml
suites_dir: benchmarks/suites
data_dir: data/results
result_dir: result

engines:
  algo-lane: algo
  algo-pool: algo
  blas-openblas: openblas
  ext-baseline: tblis

vendor_providers: [openblas]

# A baseline linked against a library built outside the measured checkout: its revision is not
# the measured revision's, so the recorder records the collector's identity (or refuses the run)
# instead of manufacturing it from the measured revision.
external_providers: [tblis]

page_name: "{library12}{version}{vendor}{dirty}"

default_invalidated_by:
  - crates/fixture/**

vendor_env:
  - OPENBLAS_NUM_THREADS
  - OMP_NUM_THREADS

# The harness loads the external baseline from its own installation, so that installation's
# lib directories go on the measured process's loader path. The fixture names them through an
# environment variable, the way a real campaign names its external provider's root.
loader_paths:
  - "$FIXTURE_EXT_ROOT/lib"
  - "$FIXTURE_EXT_ROOT/lib64"

csv_columns:
  - regime
  - family
  - dtype
  - m
  - n
  - batch
  - row
  - threads
  - total_ms
  - per_item_us
  - status
  - note

report:
  library_label: fixture-rs commit
  provider_label: fixdeps provider
  harness_label: harness commit
  index_generator: scripts/gen_index.py
  setup_script: scripts/setup_extern_deps.sh

# The charts the site generates at deploy time: a case dot plot of each current page's run, and
# one representative case followed across pins.
figures:
  cases: [fixture-kernels]

trend:
  - suite: fixture-kernels
    case: small:mul/n8/b1 f64
    engines: [algo-lane, blas-openblas]
    threads: [1]
